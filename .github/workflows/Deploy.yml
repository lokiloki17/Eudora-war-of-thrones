
name: Publicar Eudora World

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Autenticar no Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Diagnosticar credenciais Google
        run: |
          echo "Verificando credenciais..."
          if [ -f "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "Arquivo de credenciais encontrado."
          else
            echo "ERRO: Arquivo de credenciais ausente."
            exit 1
          fi
          echo "Projeto: $GOOGLE_CLOUD_PROJECT"
          firebase --version
          
      
      - name: Publicar no Firebase Hosting
        run: |
          firebase deploy --only hosting --project eudora-world-rpg --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
          GOOGLE_CLOUD_PROJECT: eudora-world-rpg

